version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: xontrix_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xontrix_store
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./apps/backend/xontrix-backend/api/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - xontrix_net

  # PHP REST API Backend
  backend:
    build:
      context: ./apps/backend/xontrix-backend
      dockerfile: Dockerfile
    container_name: xontrix_backend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_NAME: xontrix_store
      DB_USER: root
      DB_PASS: root
    depends_on:
      - mysql
    networks:
      - xontrix_net

  # Node.js Auth Server
  auth-server:
    build:
      context: ./apps/auth-server
      dockerfile: Dockerfile
    container_name: xontrix_auth
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_HOST: mysql
      DB_NAME: xontrix_store
      DB_USER: root
      DB_PASSWORD: root
      NODE_ENV: production
    depends_on:
      - mysql
    networks:
      - xontrix_net

  # React Web Frontend
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: xontrix_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - auth-server
    networks:
      - xontrix_net

volumes:
  db_data:

networks:
  xontrix_net:
    driver: bridge
